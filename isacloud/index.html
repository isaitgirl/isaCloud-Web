<!doctype html>
<html lang="pt-BR">
    <head>
        <title>isaCloud</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Chat do isaCloud, comunidade brasileira de XMPP" />
        <meta name="theme-color" content="#ff006f" />
        <link rel="icon" type="image/x-icon" href="./dist/images/favicon.ico" />
        <link rel="apple-touch-icon" href="./dist/images/isacloud/icon-180.png" />
        <link rel="manifest" href="./manifest.json" />
        <link type="text/css" rel="stylesheet" media="screen" href="./dist/converse.min.css" />
        <script type="module" src="./dist/converse.min.js"></script>
    </head>
    <body class="converse-fullscreen">
        <noscript>Ative o JavaScript para usar o chat do isaCloud.</noscript>
        <div id="conversejs-bg"></div>
        <script type="application/json" id="converse-config">
            {
                "allow_non_roster_messaging": true,
                "allow_registration": true,
                "apps": ["chat"],
                "assets_path": "/dist",
                "authentication": "login",
                "auto_away": 300,
                "auto_list_rooms": true,
                "auto_reconnect": true,
                "bosh_service_url": "https://isacloud.im/http-bind",
                "clear_cache_on_logout": false,
                "dark_theme": "isacloud-dark",
                "default_domain": "isacloud.im",
                "discover_connection_methods": false,
                "domain_placeholder": "isacloud.im",
                "i18n": "pt_BR",
                "message_archiving": "always",
                "muc_nickname_from_jid": true,
                "notification_icon": "/dist/images/isacloud/icon-192.png",
                "omemo_default": true,
                "persistent_store": "IndexedDB",
                "register_protocol_handler": true,
                "registration_domain": "isacloud.im",
                "shareable_link_url": "https://chat.isacloud.cc/",
                "show_background": false,
                "theme": "isacloud",
                "view_mode": "fullscreen",
                "websocket_url": "wss://isacloud.im/xmpp-websocket"
            }
        </script>
        <script type="module" src="./init.js"></script>
    </body>
</html>
